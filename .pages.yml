# Konfiguracja panelu Pages CMS (https://app.pagescms.org) – edycja treści w przeglądarce.
# Każdy zapis w panelu = commit do repozytorium → GitHub Actions buduje i wgrywa stronę na seohost.
#
# Treść edytowana wizualnie (rich-text zapisujący Markdown, z przełącznikiem Editor/Source).
# Edytor nie obsługuje surowego HTML, dlatego:
#  - PRZYCISK = pogrubiony link w osobnym akapicie (src/lib/rehype-cta.mjs),
#  - FAQ = pola formularza „FAQ” (nie wpisuj go w treść).

media:
  input: src/assets/images/blog
  # ścieżka względna od plików w src/content/<kolekcja>/ – Astro optymalizuje te obrazki przy buildzie
  output: ../../assets/images/blog
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif, gif]

settings:
  content:
    # zachowuj pola spoza formularza (np. id pytań FAQ z WordPressa)
    merge: true
  commit:
    templates:
      create: 'Treść: dodano {path} (Pages CMS)'
      update: 'Treść: zmieniono {path} (Pages CMS)'
      delete: 'Treść: usunięto {path} (Pages CMS)'

content:
  # ─────────────────────────── BLOG ───────────────────────────
  - name: blog
    label: Blog – wpisy
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      search: [title, description]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Tytuł (H1)
        type: string
        required: true
      - name: seoTitle
        label: Tytuł SEO (<title>)
        type: string
        description: 'Pełny tytuł w Google, np. „Audyt techniczny SEO – poradnik | Kamil Wnęk”. Puste = „Tytuł | Kamil Wnęk”.'
        options: { maxlength: 70 }
      - name: description
        label: Meta description
        type: text
        required: true
        description: Opis w wynikach Google i na karcie wpisu (ok. 140–160 znaków).
        options: { maxlength: 170 }
      - name: pubDate
        label: Data publikacji
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: updatedDate
        label: Data aktualizacji
        type: date
        default: ''
        description: Uzupełnij, gdy istotnie zaktualizujesz wpis.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: categories
        label: Kategorie
        type: select
        description: Pierwsza wybrana kategoria trafia do okruszków. Nowa kategoria? Dodaj ją w „Blog – kategorie” i w pliku .pages.yml.
        options:
          multiple: true
          values:
            - { name: ai-w-seo, label: AI w SEO }
            - { name: case-study, label: Case study }
            - { name: co-nowego-w-seo, label: Co nowego w SEO? }
            - { name: narzedzia, label: Narzędzia }
            - { name: podstawy-seo, label: Podstawy SEO }
            - { name: techniczne-seo, label: Techniczne SEO }
            - { name: tutoriale, label: Tutoriale }
            - { name: wydarzenia, label: Wydarzenia }
      - name: cover
        label: Zdjęcie główne (okładka)
        type: image
        description: Najlepiej poziome, min. 1600 px szerokości. Astro samo zrobi z niego WebP w kilku rozmiarach.
      - name: coverAlt
        label: Opis zdjęcia (alt)
        type: string
      - name: faq
        label: FAQ (pytania i odpowiedzi)
        type: object
        list: true
        description: Wyświetla się pod treścią i trafia do danych strukturalnych FAQPage.
        fields:
          - name: id
            type: string
            hidden: true
          - name: question
            label: Pytanie
            type: string
            required: true
          - name: answer
            label: Odpowiedź
            type: text
            required: true
            description: 'Można użyć prostego HTML, np. <a href="/oferta/audyt-seo/">audyt SEO</a>.'
      - name: draft
        label: Szkic (niewidoczny na stronie)
        type: boolean
        default: false
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          switcher: true
        description: 'Przycisk: osobny akapit z linkiem, cały pogrubiony. Obrazki: przeciągnij do edytora (uzupełnij opis alt). FAQ dodawaj w polu „FAQ” wyżej, nie w treści.'

  - name: kategorie
    label: Blog – kategorie
    type: file
    path: src/content/kategorie.json
    format: json
    list: true
    fields:
      - name: id
        label: Adres (slug)
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
        description: Część adresu /blog/<slug>/ – małe litery, cyfry i myślniki. Nie zmieniaj w istniejących kategoriach.
      - name: name
        label: Nazwa
        type: string
        required: true
      - name: description
        label: Opis (pod listą wpisów)
        type: text
      - name: seoTitle
        label: Tytuł SEO
        type: string
      - name: seoDescription
        label: Meta description
        type: text
      - name: noindex
        label: Ukryj przed Google (noindex)
        type: boolean
        default: false

  # ─────────────────────────── OFERTA ───────────────────────────
  - name: oferta
    label: Oferta – usługi
    type: collection
    path: src/content/oferta
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    view:
      fields: [title, group, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Nazwa usługi (H1)
        type: string
        required: true
      - name: seoTitle
        label: Tytuł SEO (<title>)
        type: string
        options: { maxlength: 70 }
      - name: description
        label: Meta description
        type: text
        required: true
        options: { maxlength: 170 }
      - name: group
        label: Kolumna w mega menu
        type: select
        required: true
        options:
          values:
            - { name: strategia-i-analiza, label: Strategia i Analiza }
            - { name: pozycjonowanie, label: Pozycjonowanie }
            - { name: linkbuilding, label: Linkbuilding }
      - name: order
        label: Kolejność w kolumnie
        type: number
        default: 100
      - name: icon
        label: Ikona
        type: select
        options:
          values:
            - { name: message-circle, label: Dymek (konsultacje) }
            - { name: search, label: Lupa (audyt) }
            - { name: trending-up, label: Wykres w górę }
            - { name: map-pin, label: Pinezka (lokalne) }
            - { name: shopping-cart, label: Koszyk (sklepy) }
            - { name: bar-chart, label: Wykres słupkowy }
            - { name: link, label: Link }
            - { name: git-compare, label: Porównanie }
            - { name: compass, label: Kompas }
            - { name: calendar, label: Kalendarz }
      - name: offers
        label: Ceny (do danych strukturalnych)
        type: object
        list: true
        description: Ceny NETTO w zł, tak jak w treści strony. Trafiają do schemy Service – zmieniając cenę w treści, popraw ją też tutaj.
        fields:
          - name: name
            label: Wariant
            type: string
          - name: minPrice
            label: Cena od (zł netto)
            type: number
            required: true
          - name: maxPrice
            label: Cena do (zł netto, opcjonalnie)
            type: number
          - name: unit
            label: Rozliczenie
            type: select
            options:
              values:
                - { name: HUR, label: za godzinę }
                - { name: MON, label: miesięcznie }
      - name: menuDescription
        label: Krótki opis w mega menu
        type: string
        options: { maxlength: 60 }
      - name: cardDescription
        label: Opis na karcie (/oferta/)
        type: text
      - name: intro
        label: Wstęp obok formularza
        type: rich-text
        options:
          format: markdown
          switcher: true
      - name: whyMe
        label: Pokaż blok „Dlaczego warto ze mną współpracować?”
        type: boolean
        default: true
      - name: faqTitle
        label: Nagłówek FAQ
        type: string
        default: Najczęściej zadawane pytania i odpowiedzi
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - name: id
            type: string
            hidden: true
          - name: question
            label: Pytanie
            type: string
            required: true
          - name: answer
            label: Odpowiedź
            type: text
            required: true
      - name: pubDate
        label: Data publikacji
        type: date
      - name: updatedDate
        label: Data aktualizacji
        type: date
        default: ''
      - name: draft
        label: Szkic (niewidoczna na stronie)
        type: boolean
        default: false
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          switcher: true

  # ─────────────────────────── STRONY ───────────────────────────
  - name: strony
    label: Strony (O mnie, Polityka prywatności)
    type: collection
    path: src/content/strony
    format: yaml-frontmatter
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Tytuł (H1)
        type: string
        required: true
      - name: seoTitle
        label: Tytuł SEO
        type: string
      - name: description
        label: Meta description
        type: text
        required: true
      - name: eyebrow
        label: Nadtytuł (mały tekst nad H1)
        type: string
      - name: updatedDate
        label: Data aktualizacji
        type: date
      - name: noindex
        label: Ukryj przed Google (noindex)
        type: boolean
        default: false
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          switcher: true
