# Build i wdrożenie na seohost:
#   gałąź main → produkcja (kamilwnek.pl)
#   gałąź dev  → wersja testowa (dev.kamilwnek.pl, noindex)
#
# Treści publikuje przycisk „Opublikuj” w /admin (npm run publikuj) – od razu na main i dev.
# Kod: push na dev → test; `npm run wdroz` → dev scalone z main → produkcja.
# Ręcznie: zakładka Actions → Deploy → Run workflow (wybierz gałąź).
#
# Sekrety (GitHub → Settings → Secrets and variables → Actions → Repository secrets):
#   FTP_SERVER                               – adres serwera FTP z panelu seohost (np. s1.seohost.pl), wspólny
#   FTP_USERNAME, FTP_PASSWORD               – konto FTP produkcji
#   FTP_TEST_USERNAME, FTP_TEST_PASSWORD     – osobne konto FTP subdomeny dev.kamilwnek.pl
#
# Katalogi docelowe nie są tajne, więc są tutaj. Ścieżki są WZGLĘDNE – od folderu, w którym ląduje się
# po zalogowaniu danym kontem FTP. Nie wpisuj pełnej ścieżki /home/… – zostałaby odtworzona w środku.
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  FTP_DIR_PROD: public_html/
  # folder dev.kamilwnek.pl widziany po zalogowaniu kontem FTP_TEST_* (np. ./ albo public_html/)
  FTP_DIR_TEST: public_html/

# jedno wdrożenie naraz na gałąź; kolejne czeka (nie przerywamy wysyłki w połowie)
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IS_PROD: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Wybór środowiska
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          PROD_USER: ${{ secrets.FTP_USERNAME }}
          PROD_PASS: ${{ secrets.FTP_PASSWORD }}
          TEST_USER: ${{ secrets.FTP_TEST_USERNAME }}
          TEST_PASS: ${{ secrets.FTP_TEST_PASSWORD }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            echo "Środowisko: PRODUKCJA (kamilwnek.pl)"
            user="$PROD_USER"; pass="$PROD_PASS"; dir="$FTP_DIR_PROD"; names="FTP_USERNAME / FTP_PASSWORD"
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
          else
            echo "Środowisko: TEST (subdomena)"
            user="$TEST_USER"; pass="$TEST_PASS"; dir="$FTP_DIR_TEST"; names="FTP_TEST_USERNAME / FTP_TEST_PASSWORD"
            echo "DEPLOY_ENV=test" >> "$GITHUB_ENV"
          fi
          [ -z "$FTP_SERVER" ] && { echo "::error::Brak sekretu FTP_SERVER"; exit 1; }
          [ -z "$user" ] || [ -z "$pass" ] && { echo "::error::Brak sekretów $names – dodaj je w Settings → Secrets and variables → Actions"; exit 1; }
          [ -z "$dir" ] && { echo "::error::Nie ustawiono katalogu docelowego (FTP_DIR_TEST w .github/workflows/deploy.yml)"; exit 1; }
          echo "FTP_DIR=$dir" >> "$GITHUB_ENV"

      - run: npm ci

      # literówka w treści (np. zła data, nieistniejąca kategoria) zatrzyma wdrożenie – strona na serwerze się nie zmieni
      - name: Sprawdzenie typów i treści
        run: npm run check

      - name: Build
        run: npm run build

      - name: Wysyłka na seohost (tylko zmienione pliki)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ github.ref_name == 'main' && secrets.FTP_USERNAME || secrets.FTP_TEST_USERNAME }}
          password: ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD || secrets.FTP_TEST_PASSWORD }}
          # FTPS (szyfrowane). Gdyby seohost odrzucał połączenie – zmień na: ftp
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_DIR }}
