# Build i wdrożenie na seohost przy każdej zmianie w gałęzi main
# (commit z Pages CMS, push z komputera albo ręcznie: zakładka Actions → Deploy → Run workflow).
#
# Wymagane sekrety (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER      – adres serwera FTP z panelu seohost (np. s1.seohost.pl)
#   FTP_USERNAME    – login FTP
#   FTP_PASSWORD    – hasło FTP
#   FTP_SERVER_DIR  – katalog strony na serwerze, ZAKOŃCZONY "/" (np. /domains/kamilwnek.pl/public_html/)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# jedno wdrożenie naraz; kolejne czeka (nie przerywamy wysyłki w połowie)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # literówka w treści (np. zła data, nieistniejąca kategoria) zatrzyma wdrożenie – strona na serwerze się nie zmieni
      - name: Sprawdzenie typów i treści
        run: npm run check

      - name: Build
        run: npm run build

      - name: Wysyłka na seohost (tylko zmienione pliki)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (szyfrowane). Gdyby seohost odrzucał połączenie – zmień na: ftp
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
