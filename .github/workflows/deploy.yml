# Build i wdrożenie na seohost:
#   gałąź main → produkcja (kamilwnek.pl) – dopiero gdy PROD_DEPLOY: 'true' (dzień przenosin z WordPressa)
#   gałąź dev  → wersja testowa (dev.kamilwnek.pl, noindex)
#
# Treści publikuje przycisk „Opublikuj” w /admin (npm run publikuj) – od razu na main i dev.
# Kod: push na dev → test; `npm run wdroz` → dev scalone z main → produkcja.
# Ręcznie: zakładka Actions → Deploy → Run workflow (wybierz gałąź).
#
# Sekrety (GitHub → Settings → Secrets and variables → Actions → Repository secrets):
#   FTP_SERVER                               – adres serwera FTP z panelu seohost (np. s1.seohost.pl), wspólny
#   FTP_USERNAME, FTP_PASSWORD               – konto FTP głównej domeny kamilwnek.pl
#   FTP_TEST_USERNAME, FTP_TEST_PASSWORD     – konto FTP subdomeny dev.kamilwnek.pl
#   TEST_HTTP_AUTH                           – login:hasło, którym otwiera się dev.kamilwnek.pl w przeglądarce
#                                              (ochrona hasłem z panelu seohost; potrzebne do kontroli celu)
#
# Zabezpieczenie: przed wysyłką workflow wgrywa plik kontrolny i sprawdza, że widać go pod adresem
# docelowej strony. Jeśli dane FTP wskazują inną stronę (np. pomylone sekrety), nic nie zostanie wysłane.
#
# Katalogi docelowe nie są tajne, więc są tutaj. Ścieżki są WZGLĘDNE – od folderu, w którym ląduje się
# po zalogowaniu danym kontem FTP. Nie wpisuj pełnej ścieżki /home/… – zostałaby odtworzona w środku.
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  # Produkcja stoi jeszcze na WordPressie. Push na main tylko sprawdza i buduje stronę – bez wysyłki.
  # W dniu przenosin (kopia WordPressa zrobiona, public_html opróżnione) zmień na 'true'.
  PROD_DEPLOY: 'false'
  PROD_HOST: kamilwnek.pl
  TEST_HOST: dev.kamilwnek.pl
  FTP_DIR_PROD: public_html/
  FTP_DIR_TEST: public_html/

# jedno wdrożenie naraz na gałąź; kolejne czeka (nie przerywamy wysyłki w połowie)
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IS_PROD: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Wybór środowiska
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          PROD_USER: ${{ secrets.FTP_USERNAME }}
          PROD_PASS: ${{ secrets.FTP_PASSWORD }}
          TEST_USER: ${{ secrets.FTP_TEST_USERNAME }}
          TEST_PASS: ${{ secrets.FTP_TEST_PASSWORD }}
          TEST_HTTP_AUTH: ${{ secrets.TEST_HTTP_AUTH }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            echo "Środowisko: PRODUKCJA ($PROD_HOST)"
            user="$PROD_USER"; pass="$PROD_PASS"; dir="$FTP_DIR_PROD"; host="$PROD_HOST"; names="FTP_USERNAME / FTP_PASSWORD"; http_auth=""
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
            if [ "$PROD_DEPLOY" != "true" ]; then
              echo "::notice::Produkcja jeszcze na WordPressie (PROD_DEPLOY: 'false') – tylko sprawdzenie i build, bez wysyłki."
              echo "UPLOAD=false" >> "$GITHUB_ENV"
              exit 0
            fi
          else
            echo "Środowisko: TEST ($TEST_HOST)"
            user="$TEST_USER"; pass="$TEST_PASS"; dir="$FTP_DIR_TEST"; host="$TEST_HOST"; names="FTP_TEST_USERNAME / FTP_TEST_PASSWORD"; http_auth="$TEST_HTTP_AUTH"
            echo "DEPLOY_ENV=test" >> "$GITHUB_ENV"
          fi
          [ -z "$FTP_SERVER" ] && { echo "::error::Brak sekretu FTP_SERVER"; exit 1; }
          [ -z "$user" ] || [ -z "$pass" ] && { echo "::error::Brak sekretów $names – dodaj je w Settings → Secrets and variables → Actions"; exit 1; }
          [ -z "$dir" ] && { echo "::error::Nie ustawiono katalogu docelowego w .github/workflows/deploy.yml"; exit 1; }
          echo "FTP_DIR=$dir" >> "$GITHUB_ENV"
          echo "UPLOAD=true" >> "$GITHUB_ENV"

          # Kontrola celu: plik z losowym kodem przez FTP → musi być widoczny pod https://$host/
          token=$(openssl rand -hex 16)
          echo "$token" > kw-deploy-check.txt
          ftp() { curl -sS -k --ssl-reqd --user "$user:$pass" "$@"; }
          ftp -T kw-deploy-check.txt "ftp://$FTP_SERVER/${dir}kw-deploy-check.txt" || { echo "::error::Nie udało się połączyć z FTP ($names)"; exit 1; }
          code=$(curl -s -o seen.txt -w '%{http_code}' ${http_auth:+-u "$http_auth"} "https://$host/kw-deploy-check.txt?$token" || true)
          seen=$(cat seen.txt 2>/dev/null || true); rm -f seen.txt
          ftp "ftp://$FTP_SERVER/" -Q "DELE ${dir}kw-deploy-check.txt" -o /dev/null || true
          rm -f kw-deploy-check.txt
          if [ "$code" = "401" ]; then
            echo "::error::$host wymaga hasła, a kontrola go nie zna albo jest błędne – dodaj/popraw sekret TEST_HTTP_AUTH (login:hasło do strony). Nic nie zostało wysłane."
            exit 1
          fi
          if [ "$seen" != "$token" ]; then
            # diagnostyka: co odpowiedziała strona i co widać na koncie FTP (same nazwy plików)
            echo "Odpowiedź https://$host/kw-deploy-check.txt: HTTP $code, treść: $(printf '%s' "$seen" | head -c 120 | tr -s '[:space:]' ' ')"
            echo "Katalog po zalogowaniu FTP:"; ftp --list-only "ftp://$FTP_SERVER/" | head -30 || true
            echo "Katalog $dir:"; ftp --list-only "ftp://$FTP_SERVER/$dir" | head -40 || true
            echo "::error::Dane FTP ($names, katalog $dir) NIE wskazują na $host (HTTP $code) – plik kontrolny nie pojawił się pod tym adresem. Nic nie zostało wysłane. Szczegóły w logu kroku „Wybór środowiska”."
            exit 1
          fi
          echo "Cel potwierdzony: $names → https://$host/"

      - run: npm ci

      # literówka w treści (np. zła data, nieistniejąca kategoria) zatrzyma wdrożenie – strona na serwerze się nie zmieni
      - name: Sprawdzenie typów i treści
        run: npm run check

      - name: Build
        run: npm run build

      - name: Wysyłka na seohost (tylko zmienione pliki)
        if: env.UPLOAD == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ github.ref_name == 'main' && secrets.FTP_USERNAME || secrets.FTP_TEST_USERNAME }}
          password: ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD || secrets.FTP_TEST_PASSWORD }}
          # FTPS (szyfrowane). Gdyby seohost odrzucał połączenie – zmień na: ftp
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_DIR }}
