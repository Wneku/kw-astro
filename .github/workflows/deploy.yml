# Build i wdrożenie na seohost przy każdej zmianie w gałęzi main
# (commit z Pages CMS, push z komputera albo ręcznie: zakładka Actions → Deploy → Run workflow).
#
# Wymagane sekrety (GitHub → Settings → Secrets and variables → Actions → Repository secrets):
#   FTP_SERVER      – adres serwera FTP z panelu seohost (np. s1.seohost.pl)
#   FTP_USERNAME    – login FTP
#   FTP_PASSWORD    – hasło FTP
#
# Katalog docelowy (FTP_DIR niżej) nie jest tajny, więc jest tutaj, a nie w sekretach.
# Ścieżka jest WZGLĘDNA – od folderu, w którym ląduje się po zalogowaniu FTP.
# Nie wpisuj pełnej ścieżki /home/… – zostałaby odtworzona w środku katalogu FTP.
name: Deploy

on:
  push:
    branches: [main]
    # zmiany tylko w pliku testowym edytora CMS nie wymagają wdrożenia
    paths-ignore:
      - 'src/cms-test/**'
  workflow_dispatch:

env:
  FTP_DIR: public_html/

# jedno wdrożenie naraz; kolejne czeka (nie przerywamy wysyłki w połowie)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Sprawdzenie sekretów przed buildem – czytelny błąd zamiast komunikatu z akcji FTP
      - name: Sprawdzenie sekretów FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Brak sekretów:$missing – dodaj je w Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

      - run: npm ci

      # literówka w treści (np. zła data, nieistniejąca kategoria) zatrzyma wdrożenie – strona na serwerze się nie zmieni
      - name: Sprawdzenie typów i treści
        run: npm run check

      - name: Build
        run: npm run build

      - name: Wysyłka na seohost (tylko zmienione pliki)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (szyfrowane). Gdyby seohost odrzucał połączenie – zmień na: ftp
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_DIR }}
